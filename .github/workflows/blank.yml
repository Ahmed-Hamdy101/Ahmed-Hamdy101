name: Update README Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # allow manual run

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Top Languages card
        run: |
          curl -o top-langs.svg \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=Ahmed-Hamdy101&layout=compact&langs_count=8&theme=github_dark"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-langs.svg
          git commit -m "Update top languages card" || exit 0
          git push
